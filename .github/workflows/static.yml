# Deploy the PhotoDroid marketing site (_www) to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "_www/**"
      - "assets/**"
      - "LICENSE"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R _www/. _site/
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          cp LICENSE _site/LICENSE
          # Source assumes _www/ sits next to assets/ and README.
          # On Pages the site root is _site/, so rewrite parent-relative links.
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 sed -i \
              -e 's|\.\./assets/|assets/|g' \
              -e 's|\.\./README\.md|https://github.com/bemtorres/PhotoDroid|g' \
              -e 's|\.\./LICENSE|https://github.com/bemtorres/PhotoDroid/blob/main/LICENSE|g'
          test -f _site/index.html
          test -f _site/install.html
          test -f _site/assets/PhotoDroid_300.png
          test -f _site/LICENSE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
